version: "3"

tasks:
  default:
    desc: List all available tasks
    cmds:
      - task --list-all
  build:
    desc: Build the project
    cmds:
      - echo "Building..."
      - go build -o bin/hw08_envdir_tool .

  test:
    desc: Run tests
    cmds:
      - ./test.sh
  local-test:
    desc: Build and run ls -la
    cmds:
      - go build -o bin/hw08_envdir_tool .
      - ./bin/hw08_envdir_tool ./testdata/env ls -la .
      - echo "Cleaninig"
      - rm -rf ./bin/*
  lint:
    desc: Run lints...
    cmds:
      - golangci-lint run .
  fmt:
    desc: Run fmt with gofumpt
    cmds:
      - gofumpt -d -e -l -w .
